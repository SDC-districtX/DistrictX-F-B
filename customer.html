<style>
/* ─────────────────────────────────────────
   TOKENS — Light carnival theme
───────────────────────────────────────── */
:root{
  --cream:   #F0E0B8;
  --cream2:  #E8D4A0;
  --cream3:  #FAF0D8;
  --navy:    #1C2B5E;
  --navy2:   #14204A;
  --coral:   #D94F3D;
  --coral2:  #BF3828;
  --gold:    #F0B429;
  --gold2:   #D99A10;
  --sky:     #4A8FC1;
  --sky2:    #3577A8;
  --orange:  #E8643A;
  --white:   #FFFFFF;
  --black:   #111111;
  --text:    #1C2B5E;
  --text2:   #3A4870;
  --text3:   #7A86AA;
  --green:   #2A9D5C;
  --red:     #C0392B;
  --line:    rgba(28,43,94,0.12);

  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --shadow-sm: 0 2px 8px rgba(28,43,94,0.10);
  --shadow-md: 0 4px 20px rgba(28,43,94,0.14);
  --shadow-lg: 0 8px 32px rgba(28,43,94,0.18);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;-webkit-text-size-adjust:100%;}

body{
  font-family:'Nunito',sans-serif;
  background:var(--cream);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  /* Subtle pinstripe texture */
  background-image:
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 28px,
      rgba(28,43,94,0.035) 28px,
      rgba(28,43,94,0.035) 29px
    );
}

/* ─────────────────────────────────────────
   SCREENS
───────────────────────────────────────── */
.screen{display:none;}
.screen.active{display:block;}

/* ─────────────────────────────────────────
   INVALID QR
───────────────────────────────────────── */
#screen-invalid{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:2rem;text-align:center;gap:1rem;
}
.invalid-icon{font-size:4rem;}
.invalid-title{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;color:var(--coral);}
.invalid-sub{color:var(--text2);font-size:0.95rem;line-height:1.6;max-width:280px;}

/* ─────────────────────────────────────────
   HEADER
───────────────────────────────────────── */
.header{
  background:var(--navy);
  position:sticky;top:0;z-index:100;
  border-bottom:4px solid var(--coral);
  box-shadow:0 4px 16px rgba(28,43,94,0.25);
}
.header-inner{
  padding:0.9rem 1.2rem 0;
  display:flex;align-items:flex-start;justify-content:space-between;
}
.brand{
  display:flex;flex-direction:column;gap:0;
}
.brand-district{
  font-family:'Permanent Marker',cursive;
  font-size:1.05rem;
  color:var(--cream2);
  letter-spacing:0.04em;
  line-height:1;
  opacity:0.85;
}
.brand-x{
  font-family:'Permanent Marker',cursive;
  font-size:2rem;
  color:var(--coral);
  line-height:0.9;
  text-shadow:2px 2px 0 var(--gold);
}
.table-pill{
  background:var(--gold);
  color:var(--navy2);
  font-family:'Bebas Neue',sans-serif;
  font-size:1rem;
  letter-spacing:0.08em;
  padding:0.35rem 1rem;
  border-radius:20px;
  margin-top:0.25rem;
  white-space:nowrap;
  box-shadow:var(--shadow-sm);
}
.header-nav{
  display:flex;gap:0;
  margin-top:0.75rem;
  border-top:1px solid rgba(255,255,255,0.08);
}
.nav-tab{
  flex:1;padding:0.65rem 0.5rem;
  background:none;border:none;
  font-family:'Nunito',sans-serif;font-weight:800;font-size:0.85rem;
  color:rgba(255,255,255,0.4);cursor:pointer;
  border-bottom:3px solid transparent;
  transition:all 0.2s;
  white-space:nowrap;
}
.nav-tab.active{
  color:var(--gold);
  border-bottom-color:var(--gold);
}

/* ─────────────────────────────────────────
   EVENT BANNER
───────────────────────────────────────── */
.event-banner{
  padding:0.7rem 1.2rem;
  font-weight:700;font-size:0.85rem;
  text-align:center;
}
.event-banner.hidden{display:none;}
.event-banner.paused{background:#FFF3CD;color:#856404;border-bottom:2px solid #FFDA6A;}
.event-banner.closed{background:#F8D7DA;color:#842029;border-bottom:2px solid #F5C6CB;}

/* ─────────────────────────────────────────
   RESTAURANT LIST SCREEN
───────────────────────────────────────── */
#screen-restaurants{padding:1.2rem;}

.section-eyebrow{
  font-family:'Bebas Neue',sans-serif;
  font-size:0.85rem;letter-spacing:0.2em;
  color:var(--text3);margin-bottom:0.35rem;
}
.section-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.9rem;letter-spacing:0.06em;
  color:var(--navy);margin-bottom:1.1rem;
}

.rest-list{display:flex;flex-direction:column;gap:1rem;}

.rest-card{
  background:var(--white);
  border-radius:var(--radius-lg);
  overflow:hidden;
  box-shadow:var(--shadow-md);
  cursor:pointer;
  border:2.5px solid transparent;
  transition:transform 0.18s,border-color 0.18s,box-shadow 0.18s;
  position:relative;
}
.rest-card:active{transform:scale(0.97);}
.rest-card.paused{opacity:0.55;pointer-events:none;filter:grayscale(0.5);}

.rest-card-img{
  width:100%;height:150px;object-fit:cover;display:block;
  background:linear-gradient(135deg,var(--cream),var(--cream2));
}
.rest-card-emoji-bg{
  width:100%;height:150px;
  background:linear-gradient(135deg,var(--cream),var(--cream2));
  display:flex;align-items:center;justify-content:center;
  font-size:4rem;
  position:relative;
}
/* Decorative star burst behind emoji */
.rest-card-emoji-bg::before{
  content:'';
  position:absolute;
  width:100px;height:100px;
  background:var(--gold);
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  opacity:0.18;
}

.rest-card-body{padding:1rem 1.1rem 1.1rem;}
.rest-card-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.4rem;letter-spacing:0.06em;
  color:var(--navy);margin-bottom:0.25rem;
}
.rest-card-desc{font-size:0.84rem;color:var(--text2);line-height:1.45;}
.rest-card-footer{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:0.75rem;padding-top:0.75rem;
  border-top:1px solid var(--line);
}
.rest-card-tag{
  font-size:0.75rem;font-weight:800;
  padding:0.25rem 0.7rem;border-radius:20px;
  letter-spacing:0.05em;text-transform:uppercase;
}
.tag-open{background:rgba(42,157,92,0.12);color:var(--green);}
.tag-closed{background:rgba(217,79,61,0.12);color:var(--coral);}
.rest-card-arrow{
  width:32px;height:32px;border-radius:50%;
  background:var(--navy);color:var(--cream);
  display:flex;align-items:center;justify-content:center;
  font-size:0.9rem;font-weight:900;
}

/* ─────────────────────────────────────────
   MENU SCREEN
───────────────────────────────────────── */
#screen-menu{padding-bottom:100px;}

.menu-top-img{
  width:100%;height:160px;object-fit:cover;
  background:linear-gradient(135deg,var(--cream),var(--cream2));
  display:flex;align-items:center;justify-content:center;
  font-size:5rem;position:relative;overflow:hidden;
}
.menu-top-img img{width:100%;height:160px;object-fit:cover;display:block;}
.menu-top-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(28,43,94,0.75) 0%,transparent 60%);
}
.menu-top-emoji{position:relative;font-size:5rem;}

.menu-rest-info{
  padding:1.1rem 1.2rem 0.8rem;
  background:var(--navy);
  border-bottom:3px solid var(--coral);
}
.menu-rest-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:2rem;letter-spacing:0.08em;
  color:var(--cream);line-height:1;
}
.menu-rest-desc{font-size:0.84rem;color:rgba(240,224,184,0.7);margin-top:0.3rem;}

.menu-back{
  display:flex;align-items:center;gap:0.6rem;
  padding:0.85rem 1.2rem;
  background:var(--cream3);
  border-bottom:1px solid var(--line);
  cursor:pointer;
}
.menu-back-label{font-weight:800;font-size:0.88rem;color:var(--sky);}

.menu-section{padding:1rem 1.2rem;}

.menu-item{
  display:flex;align-items:stretch;gap:0;
  background:var(--white);
  border-radius:var(--radius-md);
  overflow:hidden;
  box-shadow:var(--shadow-sm);
  margin-bottom:0.85rem;
  border:2px solid transparent;
  transition:border-color 0.15s;
}
.menu-item.has-qty{border-color:var(--coral);}
.menu-item.oos{opacity:0.5;}

.item-img-wrap{
  width:88px;flex-shrink:0;
  position:relative;background:var(--cream);
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;overflow:hidden;
}
.item-img-wrap img{width:88px;height:100%;object-fit:cover;display:block;}
.oos-label{
  position:absolute;inset:0;
  background:rgba(0,0,0,0.55);
  display:flex;align-items:center;justify-content:center;
  font-size:0.65rem;font-weight:900;color:var(--coral);
  text-align:center;line-height:1.2;text-transform:uppercase;letter-spacing:0.06em;
}

.item-body{
  flex:1;padding:0.75rem 0.85rem;
  display:flex;flex-direction:column;justify-content:space-between;
}
.item-name{font-weight:800;font-size:0.95rem;color:var(--navy);line-height:1.3;}
.item-desc{font-size:0.78rem;color:var(--text2);margin-top:0.2rem;line-height:1.4;}
.item-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:0.6rem;}
.item-price{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.1rem;color:var(--coral);letter-spacing:0.04em;
}

.qty-row{display:flex;align-items:center;gap:0.5rem;}
.qty-btn{
  width:30px;height:30px;border-radius:50%;border:none;
  font-size:1.1rem;font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform 0.1s;
}
.qty-btn:active{transform:scale(0.88);}
.qty-minus{background:rgba(28,43,94,0.1);color:var(--navy);}
.qty-plus {background:var(--coral);color:#fff;}
.qty-num{font-weight:900;font-size:0.95rem;min-width:20px;text-align:center;color:var(--navy);}

/* ─────────────────────────────────────────
   CART BAR
───────────────────────────────────────── */
.cart-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--navy);
  padding:1rem 1.2rem calc(1rem + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;justify-content:space-between;
  z-index:200;
  transform:translateY(110%);
  transition:transform 0.32s cubic-bezier(0.34,1.42,0.64,1);
  border-top:3px solid var(--coral);
}
.cart-bar.show{transform:translateY(0);}

.cart-left{display:flex;align-items:center;gap:0.75rem;}
.cart-badge{
  width:28px;height:28px;border-radius:50%;
  background:var(--coral);color:#fff;
  font-weight:900;font-size:0.82rem;
  display:flex;align-items:center;justify-content:center;
}
.cart-label{font-weight:800;color:var(--cream);font-size:0.9rem;}
.cart-total{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.1rem;color:var(--gold);letter-spacing:0.05em;
}
.cart-review-btn{
  background:var(--gold);color:var(--navy2);
  border:none;border-radius:var(--radius-sm);
  padding:0.65rem 1.2rem;font-weight:900;font-size:0.9rem;
  cursor:pointer;letter-spacing:0.03em;
  transition:background 0.15s,transform 0.1s;
}
.cart-review-btn:active{transform:scale(0.96);}

/* ─────────────────────────────────────────
   CHECKOUT SHEET
───────────────────────────────────────── */
.overlay{
  position:fixed;inset:0;background:rgba(20,32,74,0.65);
  z-index:300;display:none;align-items:flex-end;justify-content:center;
}
.overlay.open{display:flex;}

.sheet{
  background:var(--cream3);
  border-radius:24px 24px 0 0;
  width:100%;max-width:520px;max-height:92vh;
  overflow-y:auto;
  padding:1.5rem 1.4rem calc(1.5rem + env(safe-area-inset-bottom,0px));
  animation:sheetUp 0.3s cubic-bezier(0.32,0.72,0,1);
}
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}

.sheet-handle{
  width:40px;height:4px;border-radius:2px;
  background:var(--line);margin:0 auto 1.2rem;
}
.sheet-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.7rem;letter-spacing:0.08em;
  color:var(--navy);margin-bottom:1.1rem;
  display:flex;align-items:center;justify-content:space-between;
}
.sheet-close{
  width:32px;height:32px;border-radius:50%;
  background:rgba(28,43,94,0.1);border:none;
  color:var(--navy);font-size:1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

.checkout-rest{
  font-weight:900;color:var(--coral);font-size:1rem;
  margin-bottom:0.9rem;padding-bottom:0.8rem;
  border-bottom:2px solid var(--line);
}
.checkout-row{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:0.55rem 0;border-bottom:1px solid var(--line);gap:1rem;
}
.checkout-item-name{font-size:0.9rem;font-weight:700;color:var(--navy);flex:1;}
.checkout-item-qty{font-size:0.78rem;color:var(--text3);display:block;margin-top:0.1rem;}
.checkout-item-price{
  font-family:'Bebas Neue',sans-serif;
  font-size:1rem;color:var(--coral);white-space:nowrap;
}

.notes-row{margin-top:1rem;}
.notes-lbl{font-size:0.82rem;font-weight:800;color:var(--text2);margin-bottom:0.4rem;display:block;text-transform:uppercase;letter-spacing:0.08em;}
.notes-ta{
  width:100%;
  background:var(--white);
  border:2px solid var(--line);
  border-radius:var(--radius-sm);
  padding:0.75rem;
  font-family:'Nunito',sans-serif;font-size:0.9rem;
  color:var(--navy);resize:none;outline:none;
  transition:border-color 0.2s;
}
.notes-ta:focus{border-color:var(--sky);}

.total-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:1rem;padding-top:0.9rem;
  border-top:2.5px solid var(--navy);
}
.total-lbl{font-weight:900;font-size:1rem;color:var(--navy);}
.total-amt{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.8rem;color:var(--coral);letter-spacing:0.04em;
}

.table-confirm-row{
  margin-top:0.85rem;
  background:rgba(240,180,41,0.15);
  border:1.5px solid rgba(240,180,41,0.5);
  border-radius:var(--radius-sm);
  padding:0.65rem 0.85rem;
  font-size:0.85rem;font-weight:700;color:var(--navy2);
  display:flex;align-items:center;gap:0.5rem;
}

.confirm-btn{
  width:100%;margin-top:1.2rem;
  padding:1.05rem;
  background:var(--coral);color:#fff;
  border:none;border-radius:var(--radius-md);
  font-family:'Bebas Neue',sans-serif;
  font-size:1.4rem;letter-spacing:0.1em;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(217,79,61,0.4);
  transition:background 0.15s,transform 0.1s,box-shadow 0.15s;
}
.confirm-btn:active{transform:scale(0.98);box-shadow:0 2px 6px rgba(217,79,61,0.3);}
.confirm-btn:disabled{background:var(--text3);box-shadow:none;cursor:not-allowed;}

/* ─────────────────────────────────────────
   MY ORDERS SCREEN
───────────────────────────────────────── */
#screen-orders{padding:1.2rem;}

.order-card{
  background:var(--white);
  border-radius:var(--radius-lg);
  overflow:hidden;
  box-shadow:var(--shadow-md);
  margin-bottom:1rem;
  border:2px solid var(--line);
}
.order-card-head{
  padding:0.85rem 1.1rem;
  background:var(--navy);
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:0.5rem;
}
.order-num{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.15rem;letter-spacing:0.12em;color:var(--gold);
}
.order-status-pill{
  padding:0.3rem 0.8rem;border-radius:20px;
  font-size:0.72rem;font-weight:900;letter-spacing:0.06em;text-transform:uppercase;
}
.st-pending  {background:rgba(240,180,41,0.2); color:var(--gold);}
.st-preparing{background:rgba(74,143,193,0.2); color:var(--sky);}
.st-delivered{background:rgba(42,157,92,0.2);  color:var(--green);}
.st-cancelled{background:rgba(217,79,61,0.2);  color:var(--coral);}

.order-card-body{padding:0.9rem 1.1rem;}
.order-rest{font-weight:900;color:var(--coral);font-size:0.92rem;margin-bottom:0.45rem;}
.order-item-row{font-size:0.83rem;color:var(--text2);padding:0.18rem 0;}
.order-notes{font-size:0.8rem;color:var(--text3);font-style:italic;margin-top:0.4rem;}
.order-total-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:0.7rem;padding-top:0.7rem;border-top:1px solid var(--line);
}
.order-total-lbl{font-weight:800;font-size:0.85rem;color:var(--text2);}
.order-total-val{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.2rem;color:var(--coral);letter-spacing:0.04em;
}

.waiter-box{
  margin-top:0.75rem;
  padding:0.75rem 0.9rem;
  background:rgba(74,143,193,0.1);
  border:1.5px solid rgba(74,143,193,0.3);
  border-radius:var(--radius-sm);
}
.waiter-box-lbl{
  font-size:0.7rem;font-weight:900;color:var(--sky);
  text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.3rem;
}
.waiter-box-name{font-weight:800;font-size:0.92rem;color:var(--navy);}
.call-link{
  display:inline-flex;align-items:center;gap:0.4rem;
  margin-top:0.5rem;padding:0.45rem 1rem;
  background:var(--green);color:#fff;border-radius:8px;
  font-weight:800;font-size:0.82rem;text-decoration:none;
}

.pending-msg{
  margin-top:0.65rem;font-size:0.82rem;
  color:var(--text3);font-style:italic;
}

.empty{
  text-align:center;padding:3.5rem 1rem;
  display:flex;flex-direction:column;align-items:center;gap:0.75rem;
}
.empty-icon{font-size:3.5rem;}
.empty-text{font-size:0.92rem;color:var(--text2);line-height:1.5;}
.empty-cta{
  margin-top:0.5rem;
  background:var(--coral);color:#fff;border:none;
  border-radius:var(--radius-sm);padding:0.65rem 1.5rem;
  font-weight:900;font-size:0.9rem;cursor:pointer;
}

/* ─────────────────────────────────────────
   TOAST
───────────────────────────────────────── */
.toast{
  position:fixed;bottom:6rem;left:50%;
  transform:translateX(-50%) translateY(12px);
  background:var(--navy);color:var(--cream);
  padding:0.7rem 1.3rem;border-radius:10px;
  font-weight:700;font-size:0.85rem;
  z-index:9999;opacity:0;pointer-events:none;
  transition:all 0.28s;white-space:nowrap;max-width:88vw;
  box-shadow:var(--shadow-lg);border-top:3px solid var(--coral);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ─────────────────────────────────────────
   SPINNER
───────────────────────────────────────── */
.spinner{
  width:38px;height:38px;
  border:3px solid var(--line);border-top-color:var(--coral);
  border-radius:50%;animation:spin 0.75s linear infinite;
  margin:3rem auto;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* Loading screen */
#screen-loading{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;flex-direction:column;gap:1rem;
}
#screen-loading .brand-loading{
  font-family:'Permanent Marker',cursive;
  font-size:2.5rem;color:var(--coral);
  text-shadow:2px 2px 0 var(--gold);
}
</style>
</head>
<body>

<!-- Loading -->
<div id="screen-loading">
  <div class="brand-loading">District X</div>
  <div class="spinner"></div>
</div>

<!-- Main App -->
<div id="app" style="display:none">

  <!-- Header -->
  <div class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-district">District</div>
        <div class="brand-x">X</div>
      </div>
      <div class="table-pill" id="table-pill">TABLE —</div>
    </div>
    <div class="header-nav">
      <button class="nav-tab active" id="tab-restaurants" onclick="App.switchTab('restaurants')">🍽 Restaurants</button>
      <button class="nav-tab"        id="tab-orders"      onclick="App.switchTab('orders')">📋 My Orders</button>
    </div>
  </div>

  <!-- Event banner -->
  <div class="event-banner hidden" id="event-banner"></div>

  <!-- Restaurants Screen -->
  <div class="screen active" id="screen-restaurants">
    <div style="padding:1.2rem 1.2rem 0.5rem">
      <div class="section-eyebrow">Browse & Order</div>
      <div class="section-title">Restaurants</div>
    </div>
    <div style="padding:0 1.2rem 1.5rem" id="rest-list">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Menu Screen -->
  <div class="screen" id="screen-menu">
    <div class="menu-back" onclick="App.backToRestaurants()">
      <span style="font-size:1.1rem">←</span>
      <span class="menu-back-label">Back to Restaurants</span>
    </div>
    <div id="menu-hero">
      <!-- filled dynamically -->
    </div>
    <div class="menu-section" id="menu-items-list"></div>
  </div>

  <!-- My Orders Screen -->
  <div class="screen" id="screen-orders">
    <div style="padding:1.2rem 1.2rem 0.5rem">
      <div class="section-eyebrow">Your Activity</div>
      <div class="section-title">My Orders</div>
    </div>
    <div style="padding:0 1.2rem 1.5rem" id="orders-list"></div>
  </div>

</div><!-- /app -->

<!-- Cart Bar -->
<div class="cart-bar" id="cart-bar">
  <div class="cart-left">
    <div class="cart-badge" id="cart-badge">0</div>
    <div class="cart-label">Your Order</div>
  </div>
  <div class="cart-total" id="cart-total-lbl">0 SAR</div>
  <button class="cart-review-btn" onclick="App.openCheckout()">Review →</button>
</div>

<!-- Checkout Sheet -->
<div class="overlay" id="checkout-overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">
      Confirm Order
      <button class="sheet-close" onclick="App.closeCheckout()">✕</button>
    </div>
    <div class="checkout-rest" id="co-rest-name"></div>
    <div id="co-items"></div>
    <div class="notes-row">
      <label class="notes-lbl">Special Instructions (optional)</label>
      <textarea class="notes-ta" id="co-notes" rows="2" placeholder="e.g. No pickles, extra sauce, no onions…"></textarea>
    </div>
    <div class="total-row">
      <div class="total-lbl">Total</div>
      <div class="total-amt" id="co-total">0 SAR</div>
    </div>
    <div class="table-confirm-row">
      📍 Your table: <strong id="co-table">—</strong>
    </div>
    <button class="confirm-btn" id="co-submit-btn" onclick="App.submitOrder()">Place Order</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

//  HELPERS
// ─────────────────────────────────────
const $ = id => document.getElementById(id);
let _toastT;
function toast(msg, ms=2600){
  const el=$('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(_toastT); _toastT=setTimeout(()=>el.classList.remove('show'),ms);
}
function fmtP(n){ return n.toFixed(2)+' SAR'; }
function today(){ return new Date().toISOString().split('T')[0]; }
function fmtTime(ts){ return ts?new Date(ts).toLocaleTimeString('en-SA',{hour:'2-digit',minute:'2-digit',hour12:true}):''; }
function onFB(cb){ window.$fbReady?cb():document.addEventListener('fbReady',cb,{once:true}); }

// ─────────────────────────────────────
//  APP
// ─────────────────────────────────────
const App = {
  tableNum: null,
  sessionId: null,
  currentRestId: null,
  cart: {},        // itemId -> qty
  cartRestId: null,
  oos: {},
  paused: {},
  eventMode: 'open',

  // ── Boot ──
  boot(){
    const p = new URLSearchParams(window.location.search);
    const t = parseInt(p.get('table')) || 0;

    this.tableNum = t;
    $('table-pill').textContent = t ? 'TABLE '+t : 'DISTRICT X';
    $('co-table').textContent   = t || '—';

    const sk = 'dx_sess_'+(t||'guest');
    this.sessionId = localStorage.getItem(sk) || ('s_'+(t||'g')+'_'+Date.now());
    localStorage.setItem(sk, this.sessionId);

    onFB(()=>{
      this.listenEventMode();
      this.listenSettings();
      this.renderRestaurants();
      this.listenOrders();
      $('screen-loading').style.display='none';
      $('app').style.display='block';
    });
  },

  // ── Event mode ──
  listenEventMode(){
    window.$onValue(window.$ref(window.$db,'settings/eventMode'), s=>{
      this.eventMode = s.val()||'open';
      const b=$('event-banner');
      if(this.eventMode==='paused'){ b.className='event-banner paused'; b.textContent='⏸ Ordering is temporarily paused — please wait.'; }
      else if(this.eventMode==='closed'){ b.className='event-banner closed'; b.textContent='🔒 Ordering is now closed. Thank you for dining with us!'; }
      else{ b.className='event-banner hidden'; }
    });
  },

  // ── Settings (oos, paused) ──
  listenSettings(){
    window.$onValue(window.$ref(window.$db,'settings/outOfStock'), s=>{ this.oos=s.val()||{}; if(this.currentRestId) this.renderMenuItems(this.currentRestId); });
    window.$onValue(window.$ref(window.$db,'settings/pausedRests'), s=>{ this.paused=s.val()||{}; this.renderRestaurants(); });
  },

  // ── Restaurants ──
  renderRestaurants(){
    const list=$('rest-list');
    list.innerHTML = RESTAURANTS.map(r=>{
      const isPaused = !!this.paused[r.id];
      return `<div class="rest-card${isPaused?' paused':''}" ${isPaused?'':'onclick="App.openMenu(\''+r.id+'\')"'}>
        ${r.imageUrl
          ? `<img class="rest-card-img" src="${r.imageUrl}" alt="${r.name}">`
          : `<div class="rest-card-emoji-bg"><span style="position:relative;font-size:4rem">${r.emoji}</span></div>`}
        <div class="rest-card-body">
          <div class="rest-card-name">${r.name}</div>
          <div class="rest-card-desc">${r.description}</div>
          <div class="rest-card-footer">
            <div class="rest-card-tag ${isPaused?'tag-closed':'tag-open'}">${isPaused?'Temporarily Closed':'Open'}</div>
            ${isPaused?'':'<div class="rest-card-arrow">→</div>'}
          </div>
        </div>
      </div>`;
    }).join('');
  },

  // ── Open menu ──
  openMenu(restId){
    if(this.eventMode!=='open'){ toast('Ordering is currently '+this.eventMode+'.'); return; }
    // Clear cart if switching restaurant
    if(this.cartRestId && this.cartRestId!==restId && this.cartCount()>0){
      if(!confirm('You have items from another restaurant in your cart. Continue and clear it?')) return;
      this.cart={}; this.cartRestId=null; this.refreshCartBar();
    }
    this.currentRestId = restId;
    const r = RESTAURANTS.find(x=>x.id===restId);
    // Hero
    $('menu-hero').innerHTML = `
      <div class="menu-rest-info">
        <div class="menu-rest-name">${r.name}</div>
        <div class="menu-rest-desc">${r.description}</div>
      </div>`;
    this.renderMenuItems(restId);
    this.showScreen('menu');
  },

  renderMenuItems(restId){
    const r = RESTAURANTS.find(x=>x.id===restId);
    if(!r) return;
    $('menu-items-list').innerHTML = r.items.map(item=>{
      const isOos = !!this.oos[item.id];
      const qty   = this.cart[item.id]||0;
      return `<div class="menu-item${qty>0?' has-qty':''}${isOos?' oos':''}" id="mi-${item.id}">
        <div class="item-img-wrap">
          ${item.imageUrl
            ? `<img src="${item.imageUrl}" alt="${item.name}" style="width:88px;height:100%;object-fit:cover;display:block;">`
            : `<span style="font-size:2.2rem;position:relative;">${item.emoji}</span>`}
          ${isOos?'<div class="oos-label">Out of<br>Stock</div>':''}
        </div>
        <div class="item-body">
          <div>
            <div class="item-name">${item.name}</div>
            ${item.description?`<div class="item-desc">${item.description}</div>`:''}
          </div>
          <div class="item-bottom">
            <div class="item-price">${fmtP(item.price)}</div>
            ${!isOos?`<div class="qty-row">
              <button class="qty-btn qty-minus" onclick="App.changeQty('${item.id}',-1)">−</button>
              <div class="qty-num" id="qn-${item.id}">${qty}</div>
              <button class="qty-btn qty-plus"  onclick="App.changeQty('${item.id}',1)">+</button>
            </div>`:`<div style="font-size:0.75rem;color:var(--coral);font-weight:800;">Out of Stock</div>`}
          </div>
        </div>
      </div>`;
    }).join('');
  },

  changeQty(itemId, d){
    if(this.eventMode!=='open'){ toast('Ordering is '+this.eventMode+'.'); return; }
    const cur = this.cart[itemId]||0;
    const nxt = Math.max(0, cur+d);
    this.cart[itemId]=nxt;
    this.cartRestId = this.currentRestId;
    const el=document.getElementById('qn-'+itemId);
    if(el) el.textContent=nxt;
    // Highlight row
    const row=document.getElementById('mi-'+itemId);
    if(row){ row.classList.toggle('has-qty', nxt>0); }
    this.refreshCartBar();
  },

  cartItems(){
    const r = RESTAURANTS.find(x=>x.id===this.cartRestId);
    if(!r) return [];
    return r.items.filter(i=>(this.cart[i.id]||0)>0).map(i=>({...i,qty:this.cart[i.id]}));
  },
  cartTotal(){ return this.cartItems().reduce((s,i)=>s+i.price*i.qty,0); },
  cartCount(){ return this.cartItems().reduce((s,i)=>s+i.qty,0); },

  refreshCartBar(){
    const n=this.cartCount(), t=this.cartTotal();
    const bar=$('cart-bar');
    n>0 ? bar.classList.add('show') : bar.classList.remove('show');
    $('cart-badge').textContent=n;
    $('cart-total-lbl').textContent=fmtP(t);
  },

  openCheckout(){
    const items=this.cartItems();
    if(!items.length) return;
    const r=RESTAURANTS.find(x=>x.id===this.cartRestId);
    $('co-rest-name').textContent=r.name;
    $('co-items').innerHTML=items.map(i=>`
      <div class="checkout-row">
        <div class="checkout-item-name">${i.name}<span class="checkout-item-qty">×${i.qty}</span></div>
        <div class="checkout-item-price">${fmtP(i.price*i.qty)}</div>
      </div>`).join('');
    $('co-total').textContent=fmtP(this.cartTotal());
    $('co-notes').value='';
    $('checkout-overlay').classList.add('open');
  },
  closeCheckout(){ $('checkout-overlay').classList.remove('open'); },

  async submitOrder(){
    const items=this.cartItems();
    if(!items.length) return;
    const btn=$('co-submit-btn');
    btn.disabled=true; btn.textContent='Placing Order…';
    const db=window.$db, d=today();
    try{
      // Use timestamp-based order number to avoid counter race condition
      const orderNum='DX'+String(Date.now()).slice(-5);
      const r=RESTAURANTS.find(x=>x.id===this.cartRestId);
      const notes=$('co-notes').value.trim();
      // Firebase rejects null values — only include fields with real values
      const order={
        orderNum,
        tableNum: this.tableNum||0,
        sessionId: this.sessionId,
        restaurantId: this.cartRestId,
        restaurantName: r.name,
        items: items.map(i=>({id:i.id, name:i.name, price:i.price, qty:i.qty})),
        total: this.cartTotal(),
        status: 'pending',
        date: d,
        createdAt: Date.now(),
      };
      // Only add notes if not empty
      if(notes) order.notes = notes;

      await window.$push(window.$ref(db,'orders/'+d), order);
      this.cart={}; this.cartRestId=null; this.refreshCartBar();
      this.renderMenuItems(this.currentRestId);
      this.closeCheckout();
      toast('✅ Order '+orderNum+' placed!');
      this.switchTab('orders');
    } catch(e){
      console.error('Order failed:', e.code, e.message);
      toast('❌ Failed: '+(e.message||'Please try again.'));
    }
    finally{ btn.disabled=false; btn.textContent='Place Order'; }
  },

  backToRestaurants(){ this.currentRestId=null; this.showScreen('restaurants'); },

  // ── My orders ──
  listenOrders(){
    window.$onValue(window.$ref(window.$db,'orders/'+today()), s=>{
      const all=s.val()||{};
      const mine=Object.values(all)
        .filter(o=>o.sessionId===this.sessionId)
        .sort((a,b)=>b.createdAt-a.createdAt);
      this.renderOrders(mine);
    });
  },

  renderOrders(orders){
    const list=$('orders-list');
    if(!orders.length){
      list.innerHTML=`<div class="empty">
        <div class="empty-icon">🛍</div>
        <div class="empty-text">No orders yet.<br>Browse the restaurants to get started.</div>
        <button class="empty-cta" onclick="App.switchTab('restaurants')">Browse Restaurants</button>
      </div>`; return;
    }
    const labels={pending:'⏳ Pending',preparing:'🔥 Preparing',delivered:'✅ Delivered',cancelled:'❌ Cancelled'};
    list.innerHTML=orders.map(o=>`
      <div class="order-card">
        <div class="order-card-head">
          <div class="order-num">${o.orderNum}</div>
          <div class="order-status-pill st-${o.status}">${labels[o.status]||o.status}</div>
        </div>
        <div class="order-card-body">
          <div class="order-rest">${o.restaurantName}</div>
          ${o.items.map(i=>`<div class="order-item-row">• ${i.name} × ${i.qty} — ${fmtP(i.price*i.qty)}</div>`).join('')}
          ${o.notes?`<div class="order-notes">📝 ${o.notes}</div>`:''}
          <div class="order-total-row">
            <div class="order-total-lbl">Order Total</div>
            <div class="order-total-val">${fmtP(o.total)}</div>
          </div>
          ${o.status==='pending'
            ? `<div class="pending-msg">⏳ Waiting for a waiter to accept your order…</div>`
            : (o.waiterName && o.status!=='cancelled')
              ? `<div class="waiter-box">
                  <div class="waiter-box-lbl">Your Waiter</div>
                  <div class="waiter-box-name">👤 ${o.waiterName}</div>
                  ${o.waiterPhone?`<a class="call-link" href="tel:${o.waiterPhone}">📞 Call Waiter</a>`:''}
                </div>` : ''}
        </div>
      </div>`).join('');
  },

  // ── Navigation ──
  switchTab(tab){
    ['restaurants','orders'].forEach(t=>{
      $('tab-'+t).classList.toggle('active',t===tab);
    });
    if(tab==='restaurants'){ this.showScreen('restaurants'); }
    else{ this.showScreen('orders'); }
  },

  showScreen(name){
    ['restaurants','menu','orders'].forEach(s=>{ const el=$('screen-'+s); if(el) el.classList.remove('active'); });
    const target=$('screen-'+name);
    if(target) target.classList.add('active');
    if(name!=='menu') this.currentRestId=null;
  },
};

// ── Boot ──
document.addEventListener('DOMContentLoaded',()=>App.boot());
</script>
</body>
</html>
